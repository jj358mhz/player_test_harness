services:
  player-test-harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: player-test-harness:dev
    ports:
      - "${WEB_PORT:-5051}:5000"
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      LOG_LEVEL: debug
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    entrypoint: []
    command: ["sh", "-c", "alembic upgrade head && flask --app app run --host=0.0.0.0 --port=5000 --debug"]

networks:
  web:
    external: false
    driver: bridge
    name: player-test-harness_web
